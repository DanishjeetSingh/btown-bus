name: BTownBus
options:
  bundleIdPrefix: me.singhdan
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FY8QPUD5XV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BTownBus:
    type: application
    platform: iOS
    sources:
      - BTownBus
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.singhdan.btownbus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: BTownBus/Info.plist
      properties:
        CFBundleDisplayName: B-Town Bus
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: B-Town Bus uses your location to find nearby stops, estimate your walk, and tell you when you're already at your stop.
        NSLocationAlwaysAndWhenInUseUsageDescription: While you're tracking a bus, B-Town Bus keeps checking your location so the Live Activity can update your walk time and notice when you reach the stop.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: BTownBusWidgets
  BTownBusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - BTownBusWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.singhdan.btownbus.widgets
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: BTownBusWidgets/Info.plist
      properties:
        CFBundleDisplayName: B-Town Bus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  BTownBus:
    build:
      targets:
        BTownBus: all
        BTownBusWidgets: all
    run:
      config: Debug
